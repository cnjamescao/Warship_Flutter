# ================================================================
# CI —— 规格 §7「基础设施与工程要求」
# ================================================================
# 规则（来自 Spec/Warship产品设计.md §7）：
#   * 分析和测试是 PR 必需检查；
#   * macOS build 在已完成 Xcode 首次启动/许可的 runner 上运行；
#   * 修改 pubspec.yaml 必须同步更新 pubspec.lock；
#   * 不得提交 build/、.dart_tool/ 或 ephemeral 生成物。
# ================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的重复推送只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 固定 Flutter 版本，保证本地与 CI 行为一致
  FLUTTER_VERSION: 3.47.1

jobs:
  # ------------------------------------------------------------
  # 静态分析 + 测试：不依赖 Xcode，跑得最快，作为第一道门禁
  # ------------------------------------------------------------
  analyze-and-test:
    name: 分析 / 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 校验 pubspec.lock 与 pubspec.yaml 同步
        # 规格要求：改了 pubspec.yaml 就必须更新 pubspec.lock
        run: flutter pub get --enforce-lockfile

      - name: 确认没有提交生成物
        run: |
          # 只拦截**构建产物**：
          #   * assets/config/v2/manifest.json 是构建复制品；
          #   * assets/images/v2/ 与 assets/audio/v2/ 是复制出来的运行时文件。
          # 注意 assets/config/v2/ 下的 player.json / enemies.json 等是
          # **手写内容配置**，必须入库 —— 不能整目录拦截。
          offenders=$(git ls-files | grep -E '^(build/|\.dart_tool/)|/ephemeral/|^assets/config/v2/manifest\.json$|^assets/(images|audio)/v2/' || true)
          if [ -n "$offenders" ]; then
            echo "::error::以下生成物不应被提交："
            echo "$offenders"
            exit 1
          fi

      - name: 安装素材校验所需工具
        # validate_visual_state_assets.py 与 validate_audio_mix.py 依赖 ffmpeg
        # 解码 PNG / 分析响度；ubuntu runner 默认未安装。
        # 这里显式安装，而不是跳过门禁 —— 门禁必须真实执行才有意义。
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: 素材发布门禁（交付清单 §6）
        run: |
          python3 素材/元数据/validate_release_manifest.py
          python3 素材/元数据/validate_visual_state_assets.py
          python3 素材/元数据/validate_audio_mix.py
          python3 素材/元数据/validate_web_load_budget.py

      - name: 构建 v2.0 资源复制（素材/ → assets/）
        # 这些副本是构建产物，不入库；测试与打包都依赖它。
        run: dart run tool/build_v2_assets.dart

      - name: flutter analyze
        run: flutter analyze

      # 排除 golden：本 job 在 ubuntu，字体渲染与 macOS 不同，
      # 像素基线必须在 macOS 比对（见 dart_test.yaml 的 tag 说明）。
      - name: flutter test
        run: flutter test --exclude-tags golden --reporter expanded

  # ------------------------------------------------------------
  # macOS 原生构建
  # ------------------------------------------------------------
  # 说明：GitHub 的 macos runner 已经预装了 Xcode 并完成首次启动/许可，
  # 因此这里可以直接构建。如果换到自建 runner，
  # 需要先在该机器上执行 `sudo xcodebuild -license accept`。
  # ------------------------------------------------------------
  # ------------------------------------------------------------
  # Web 构建
  # ------------------------------------------------------------
  # 意义：目标要求「架构需为后续 Web 阶段预留扩展性、**避免二次重写**」。
  # 这条**曾经是空话** —— 项目连 web 平台都没配置，从未验证过能编译。
  # 补上验证后发现了两个真实缺陷（PCG32 的 64 位字面量让 JS 编译失败、
  # 且实现并非自报的 pcg32-xsh-rr），均已修复。
  #
  # 因此这个 job 是**护栏**：防止以后有人再用 Web 不支持的 64 位整数
  # 或平台专属 API，把"可扩展性"重新破坏掉。
  build-web:
    name: Web 构建
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 v2.0 资源复制（素材/ → assets/）
        run: dart run tool/build_v2_assets.dart

      - name: flutter build web --release
        run: flutter build web --release

  build-macos:
    name: macOS 构建
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装 Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 检查 Xcode 是否就绪
        id: xcode
        run: |
          if xcodebuild -checkFirstLaunchStatus >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Xcode 尚未完成首次启动/许可，跳过 macOS 构建"
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 v2.0 资源复制（素材/ → assets/）
        run: dart run tool/build_v2_assets.dart

      # 注意：**Golden 不在这里跑**。
      #
      # 实测：本机 macOS 上生成的基线，在 CI 的 macos-latest runner 上
      # **6 个全部失败** —— 两者的渲染并不逐字节一致（系统版本、
      # 无 GPU 的软件光栅路径等差异）。也就是说"macOS"并不等于
      # 一个足够稳定的比对平台。
      #
      # 因此 Golden 目前是**本地/发布前门禁**，不是 CI 门禁：
      #   flutter test --tags golden
      # 若要在 CI 落地，需先把基线**在 runner 本身上生成**
      # （例如加一个手动触发的工作流，用 `--update-goldens` 产出
      # 并作为 artifact 下载回来）。详见 docs/研发反馈意见.md 的 F-06/F-11。

      - name: flutter build macos --debug
        if: steps.xcode.outputs.ready == 'true'
        run: flutter build macos --debug
